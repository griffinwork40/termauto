[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "termauto"
version = "0.1.0"
description = "Local-first LLM-powered shell completion. Cotabby for the terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "griffinlong" }]
dependencies = [
    "mlx-lm>=0.20",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "click>=8.1",
    "pydantic>=2.5",
]

[project.scripts]
termauto = "termauto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
termauto = ["shell/*.zsh"]
